name: PHPUnit

on:
  pull_request:
  push:
    branches:
      - main

env:
  COMPOSER_ARGS: --no-interaction

jobs:

  tests:
    name: Tests

    strategy:
      matrix:
        php: ['8.4', '8.5']
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: mbstring, xml, json
          coverage: xdebug

      - name: Install dependencies
        run: composer install $COMPOSER_ARGS

      - name: Test
        run: |
          composer test-coverage
          composer cs-check
          composer license-check
          composer phpstan

      - name: Benchmarks smoke run
        run: composer bench -- --revs=1 --iterations=1 --stop-on-error

      - name: Upload coverage results to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: clover.xml
          format: clover
          flag-name: php-${{ matrix.php }}
          parallel: true

  coverage:
    name: Coverage

    needs: tests
    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:
      - name: Finish Coveralls parallel build
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
